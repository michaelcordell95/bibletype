<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BibleType Pro</title>
    <style>
        :root { --main-yellow: #e2b714; --bg-dark: #323437; --text-muted: #646669; --text-light: #d1d0c5; --error: #ca4754; }
        body { background-color: var(--bg-dark); color: var(--text-muted); font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        #nav-header { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        select, button { background: #2c2e31; border: 1px solid #444; color: var(--main-yellow); padding: 10px; font-family: monospace; border-radius: 4px; cursor: pointer; }
        #fetch-btn { background: var(--main-yellow); color: var(--bg-dark); border: none; font-weight: bold; padding: 10px 25px; }
        .settings-bar { margin-bottom: 20px; display: flex; gap: 15px; font-size: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
        #stats-bar { margin-bottom: 20px; font-size: 16px; color: var(--main-yellow); display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .stat-box { background: #2c2e31; padding: 8px 15px; border-radius: 4px; border: 1px solid #444; min-width: 85px; text-align: center; }
        
        /* UPDATED: Larger Base Font Size for Mobile */
        #display { font-size: 28px; max-width: 900px; line-height: 1.6; text-align: center; min-height: 150px; padding: 20px; position: relative; }
        
        span { color: var(--text-muted); border: none !important; background: none !important; }
        .current-char { position: relative; color: var(--text-muted) !important; }
        .current-char::before { content: ""; position: absolute; left: -1px; top: 15%; height: 70%; width: 2px; background-color: var(--main-yellow); animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .correct { color: var(--text-light) !important; }
        .incorrect { color: var(--error) !important; background-color: #3e2b2d !important; border-radius: 2px; }
        #hidden-input { position: absolute; opacity: 0; pointer-events: none; }
        #caps-alert { background-color: var(--error); color: white; padding: 10px; border-radius: 4px; margin-bottom: 20px; display: none; font-weight: bold; }
        #reset-score-btn { background: #ca4754; color: white; border: none; padding: 5px 10px; font-size: 12px; cursor: pointer; border-radius: 4px; }
        
        /* UPDATED: Much Larger Desktop Font Size */
        @media (min-width: 768px) { #display { font-size: 44px; } }
    </style>
</head>
<body>

    <div id="caps-alert">CAPS LOCK IS ON!</div>

    <div id="nav-header">
        <select id="lang-select">
            <option value="KJV">English (KJV)</option>
            <option value="KO">Korean (KRV)</option>
        </select>
        <select id="book-select"></select>
        <select id="chapter-select"></select>
        <select id="verse-select"></select>
        <button id="fetch-btn" onclick="fetchVerses()">LOAD</button>
    </div>

    <div class="settings-bar">
        <label><input type="checkbox" id="easy-mode"> Easy Mode</label>
        <label><input type="checkbox" id="repeat-mode"> Repeat Verse</label>
        <span id="high-score-display" style="color:var(--text-light)">Best: 0 WPM</span>
        <button id="reset-score-btn" onclick="resetBestScore()">Reset Best</button>
    </div>

    <div id="stats-bar">
        <div class="stat-box">WPM: <span id="wpm">0</span></div>
        <div class="stat-box">Max: <span id="max-wpm">0</span></div>
        <div class="stat-box">Acc: <span id="accuracy">100</span>%</div>
        <div class="stat-box">Verse: <span id="progress">0/0</span></div>
    </div>

    <div id="display">Select book and click LOAD...</div>
    <input type="text" id="hidden-input" autocomplete="off" spellcheck="false">

    <script>
        const books = ["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];
        const chapCounts = [50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];

        let currentVerses = [], currentIndex = 0, startTime = null, totalCharsTyped = 0, totalErrors = 0, maxWPM = 0, activeVerseText = "";
        const bookSel = document.getElementById('book-select'), 
              chapSel = document.getElementById('chapter-select'), 
              verseSel = document.getElementById('verse-select'), 
              displayEl = document.getElementById('display'), 
              inputEl = document.getElementById('hidden-input');

        inputEl.addEventListener('keyup', (e) => {
            const capsAlert = document.getElementById('caps-alert');
            capsAlert.style.display = e.getModifierState('CapsLock') ? 'block' : 'none';
        });

        function resetBestScore() {
            localStorage.setItem('bibleTypeBest', 0);
            document.getElementById('high-score-display').innerText = `Best: 0 WPM`;
            maxWPM = 0;
            document.getElementById('max-wpm').innerText = 0;
        }

        function initMenus() {
            bookSel.innerHTML = "";
            books.forEach(b => { 
                let opt = document.createElement('option'); opt.value = b; opt.innerText = b; bookSel.appendChild(opt); 
            });
            bookSel.value = "John";
            bookSel.addEventListener('change', updateChapters);
            updateChapters();
        }

        function updateChapters() {
            const idx = books.indexOf(bookSel.value);
            const count = chapCounts[idx] || 1;
            let html = "";
            for(let i=1; i<=count; i++) { html += `<option value="${i}">Chapter ${i}</option>`; }
            chapSel.innerHTML = html;
            updateVerseList(50);
        }

        function updateVerseList(num) {
            let html = "";
            for(let i=1; i<=num; i++) { html += `<option value="${i-1}">Verse ${i}</option>`; }
            verseSel.innerHTML = html;
        }

        async function fetchVerses() {
            const lang = document.getElementById('lang-select').value;
            const bookName = bookSel.value;
            const chapNum = chapSel.value;
            const targetVerse = parseInt(verseSel.value);
            const isEasy = document.getElementById('easy-mode').checked;
            
            displayEl.innerText = `Connecting...`;
            
            try {
                let textArray = [];
                if (lang === "KJV") {
                    const res = await fetch(`https://bible-api.com/${encodeURIComponent(bookName)}+${chapNum}?translation=kjv`);
                    const data = await res.json();
                    textArray = data.verses.map(v => v.text);
                } else {
                    const bookId = books.indexOf(bookName) + 1;
                    const res = await fetch(`https://bolls.life/get-chapter/KRV/${bookId}/${chapNum}/`);
                    const data = await res.json();
                    textArray = data.map(v => v.text);
                }
                
                currentVerses = textArray.map(t => {
                    let clean = t.trim().replace(/[\u00A0\u1680\u180E\u2000-\u200B\u202F\u205F\u3000\uFEFF]/g, ' ').replace(/\s+/g, ' ');
                    clean = clean.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
                    if (isEasy) clean = clean.toLowerCase().replace(/[^a-z0-9\s]/gi, '');
                    return clean;
                });

                updateVerseList(currentVerses.length);
                currentIndex = targetVerse < currentVerses.length ? targetVerse : 0;
                verseSel.value = currentIndex;
                
                resetGame();
            } catch (e) { 
                displayEl.innerText = "Error loading. Try again."; 
                console.log(e);
            }
        }

        function resetGame() {
            startTime = null; totalCharsTyped = 0; totalErrors = 0;
            loadVerse();
            inputEl.focus();
        }

        function loadVerse() {
            if (currentIndex >= currentVerses.length) { 
                displayEl.innerHTML = `<div style="color:var(--main-yellow)">Chapter Complete!</div>`; 
                return; 
            }
            activeVerseText = currentVerses[currentIndex];
            renderDisplay("");
            document.getElementById('progress').innerText = `${currentIndex + 1}/${currentVerses.length}`;
            inputEl.value = "";
        }

        function renderDisplay(typed) {
            displayEl.innerHTML = activeVerseText.split('').map((char, i) => {
                let className = (i < typed.length) ? (typed[i] === activeVerseText[i] ? "correct" : "incorrect") : (i === typed.length ? "current-char" : "");
                let charToShow = (char === " " && i < typed.length && typed[i] !== " ") ? "_" : char;
                return `<span class="${className}">${charToShow}</span>`;
            }).join('');
        }

        inputEl.addEventListener('input', () => {
            if (!startTime) startTime = new Date();
            const typed = inputEl.value;
            renderDisplay(typed);
            if (typed.length > 0 && typed[typed.length-1] !== activeVerseText[typed.length-1]) totalErrors++;
            const mins = (new Date() - startTime) / 60000;
            const currentWPM = Math.round(((totalCharsTyped + typed.length) / 5) / mins) || 0;
            
            if (currentWPM > maxWPM && mins > 0.1) { 
                maxWPM = currentWPM; 
                document.getElementById('max-wpm').innerText = maxWPM;
                let best = localStorage.getItem('bibleTypeBest') || 0;
                if (maxWPM > best) {
                    localStorage.setItem('bibleTypeBest', maxWPM);
                    document.getElementById('high-score-display').innerText = `Best: ${maxWPM} WPM`;
                }
            }
            
            const acc = Math.max(0, Math.round(((totalCharsTyped + typed.length - totalErrors) / (totalCharsTyped + typed.length)) * 100)) || 100;
            document.getElementById('wpm').innerText = currentWPM;
            document.getElementById('accuracy').innerText = acc + "%";

            if (typed.length >= activeVerseText.length && activeVerseText.length > 0) {
                totalCharsTyped += activeVerseText.length;
                
                const repeatMode = document.getElementById('repeat-mode').checked;
                if (!repeatMode) {
                    currentIndex++;
                }
                
                setTimeout(loadVerse, 50);
            }
        });

        initMenus();
        window.addEventListener('click', (e) => { 
            if(!['SELECT', 'BUTTON', 'INPUT'].includes(e.target.tagName)) inputEl.focus(); 
        });

        let savedBest = localStorage.getItem('bibleTypeBest') || 0;
        document.getElementById('high-score-display').innerText = `Best: ${savedBest} WPM`;
    </script>
</body>
</html>
